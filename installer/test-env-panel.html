<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hapësira e testit</title>
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1b1a17;--mut:#6f6b63;--line:#e6e3dc;--soft:#efede7;
  --acc:#1b1a17;--acc-ink:#fff;--ok:#15803d;--ok-bg:#dcfce7;--off:#78716c;--off-bg:#ece9e2;--busy:#b45309;--busy-bg:#fef3c7;--bad:#b91c1c;
  --shadow:0 1px 2px rgba(27,26,23,.04),0 8px 24px -12px rgba(27,26,23,.12);
  --ease:cubic-bezier(.23,1,.32,1);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141311;--card:#1e1d1a;--ink:#f4f2ec;--mut:#a09b91;--line:#2f2d28;--soft:#282621;
  --acc:#f4f2ec;--acc-ink:#141311;--ok:#4ade80;--ok-bg:#12301d;--off:#a8a29e;--off-bg:#2a2824;--busy:#fbbf24;--busy-bg:#33280d;--bad:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI Variable",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:32px 16px 56px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.brand{display:flex;gap:14px;align-items:center}
.logo{width:44px;height:44px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
h1{font-size:22px;line-height:1.2;margin:0;letter-spacing:-.01em}
.sub{color:var(--mut);margin:2px 0 0;font-size:14px}
.sum{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mut);display:flex;gap:6px;align-items:center}
.pill b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;animation:in .35s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;gap:14px;align-items:center}
.av{width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:19px;flex:none;text-transform:uppercase}
.nm{flex:1;min-width:0}
.nm h2{margin:0;font-size:18px;text-transform:capitalize;letter-spacing:-.005em}
.meta{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.card{min-width:0}.top>*{min-width:0}.chip{flex:none}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;display:inline-flex;align-items:center;gap:6px;background:var(--off-bg);color:var(--off)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.on{background:var(--ok-bg);color:var(--ok)}
.chip.busy{background:var(--busy-bg);color:var(--busy)}
.chip.busy i{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.login{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.login code{font:600 13px ui-monospace,Consolas,monospace;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:transform .16s var(--ease),background .16s,opacity .16s;min-height:40px}
.btn:hover{background:var(--soft)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);flex:1;justify-content:center}
.btn.primary:hover{opacity:.9;background:var(--acc)}
.btn.off{opacity:.4;pointer-events:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:16px;height:16px}
.more{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.more .btn{font-weight:500;font-size:13px;min-height:36px;padding:7px 11px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:32px;text-align:center;color:var(--mut)}
.empty code{background:var(--soft);padding:2px 6px;border-radius:6px;color:var(--ink)}
footer{margin-top:28px;color:var(--mut);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:var(--acc);color:var(--acc-ink);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:all .25s var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg></div>
      <div><h1>Hapësira e testit</h1><p class="sub">Zgjidh një kompani për ta parë si duket dhe si funksionon. Të dhëna të shpikura, pa lidhje me repo.</p></div>
    </div>
    <div class="sum" id="sum"></div>
  </header>
  <main class="grid" id="list" aria-live="polite"></main>
  <footer><span>Kodi vjen nga <code>Source/</code> në këtë PC.</span><span id="upd"></span></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  var list=document.getElementById('list'),sum=document.getElementById('sum'),upd=document.getElementById('upd'),toast=document.getElementById('toast');
  var ICON={open:'M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5',play:'M6 4l14 8-14 8z',stop:'M6 6h12v12H6z',refresh:'M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5',db:'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6'};
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
  function icon(name){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','2');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');var p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',ICON[name]);s.appendChild(p);return s}
  function btn(label,ic,cls,onclick){var b=el('button','btn '+(cls||''));b.type='button';b.appendChild(icon(ic));b.appendChild(document.createTextNode(label));b.addEventListener('click',onclick);return b}
  function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(say.t);say.t=setTimeout(function(){toast.classList.remove('show')},2600)}
  function act(action,name,msg,confirmText){
    if(confirmText&&!confirm(confirmText))return;
    fetch('/api/'+action+'/'+name,{method:'POST'}).then(function(){say(msg);load()})
  }
  var LABEL={start:'po niset',stop:'po ndalet',update:'po përditësohet nga kodi',seed:'po ngarkohen të dhënat'};
  function card(c,i){
    var d=el('article','card');d.style.animationDelay=(i*60)+'ms';
    var top=el('div','top'),av=el('div','av',c.name.charAt(0)),nm=el('div','nm');
    nm.appendChild(el('h2',null,c.name));
    var vm=/^(.*)-test([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})([0-9]{2})$/.exec(c.version);
    nm.appendChild(el('div','meta',vm?('v'+vm[1]+' · kodi i '+vm[4]+'.'+vm[3]+' '+vm[5]+':'+vm[6]+' · porta '+c.port):('v'+c.version+' · porta '+c.port)));
    var chip=el('span','chip '+(c.busy?'busy':c.up?'on':''));chip.appendChild(el('i'));
    chip.appendChild(document.createTextNode(c.busy?(LABEL[c.busy]||'po punon'):c.up?'Punon':'Ndalur'));
    top.appendChild(av);top.appendChild(nm);top.appendChild(chip);d.appendChild(top);
    var lg=el('div','login');lg.appendChild(el('span',null,'Hyrje testimi'));
    var cd=el('span');cd.appendChild(el('code',null,'pronari'));cd.appendChild(document.createTextNode('  ·  '));cd.appendChild(el('code',null,'testtest123'));lg.appendChild(cd);d.appendChild(lg);
    var row=el('div','row');
    var open=el('a','btn primary'+(c.up&&!c.busy?'':' off'));open.href='http://localhost:'+c.port+'/';open.target='_blank';open.rel='noopener';open.appendChild(icon('open'));open.appendChild(document.createTextNode('Hyr te '+c.name));row.appendChild(open);
    row.appendChild(c.up?btn('Ndale','stop','',function(){act('stop',c.name,c.name+' u ndal')}):btn('Nise','play','',function(){act('start',c.name,c.name+' po niset')}));
    d.appendChild(row);
    var more=el('div','more');
    more.appendChild(btn('Përditëso nga kodi','refresh','',function(){act('update',c.name,c.name+': po rindërtohet nga kodi (disa minuta)')}));
    more.appendChild(btn('Ringarko të dhënat testuese','db','',function(){act('seed',c.name,c.name+': po ngarkohen të dhënat e reja','Të dhënat testuese të '+c.name+' do të zëvendësohen me 520+ punonjës të rinj. Vazhdon?')}));
    d.appendChild(more);
    if(c.busy)d.querySelectorAll('.btn').forEach(function(b){b.setAttribute('disabled','')});
    return d;
  }
  function render(r){
    list.replaceChildren();sum.replaceChildren();
    var up=r.filter(function(c){return c.up}).length;
    var p1=el('span','pill');p1.appendChild(el('b',null,String(r.length)));p1.appendChild(document.createTextNode('kompani'));
    var p2=el('span','pill');p2.appendChild(el('b',null,String(up)));p2.appendChild(document.createTextNode('aktive'));
    sum.appendChild(p1);sum.appendChild(p2);
    if(!r.length){var e=el('div','empty');e.appendChild(document.createTextNode('Asnjë kompani ende. Shto një me '));e.appendChild(el('code',null,'test-env.bat add emri local'));list.appendChild(e);return}
    r.forEach(function(c,i){list.appendChild(card(c,i))});
  }
  var first=true,last='';
  function load(){
    fetch('/api/list').then(function(x){return x.json()}).then(function(r){
      var key=JSON.stringify(r);upd.textContent='Përditësuar '+new Date().toLocaleTimeString('sq',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      if(key!==last){last=key;render(r)}
      first=false;
    }).catch(function(){upd.textContent='Paneli nuk përgjigjet'});
  }
  load();setInterval(load,3000);
})();
</script>
</body>
</html>
